<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pushup Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Pushup Counter</h1>
      <p class="subtitle">Track pushup sets and reps only.</p>

      <section class="counter-card" aria-label="Pushup counts">
        <div class="count">
          <span class="label">Sets</span>
          <span id="setCount" class="value">0</span>
        </div>
        <div class="count">
          <span class="label">Reps</span>
          <span id="repCount" class="value">0</span>
        </div>
      </section>

      <section class="actions" aria-label="Counter controls">
        <button id="addRepBtn" class="btn primary">+1 Rep</button>
        <button id="completeSetBtn" class="btn">Complete Set</button>
        <button id="resetBtn" class="btn danger">Reset</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
